name: Verify forms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so upstream drift surfaces here and not in a user project.
    - cron: "0 6 * * 1"

permissions:
  # Render and build only; nothing here writes to the repository.
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forms:
    name: ${{ matrix.form }} (${{ matrix.combo.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form: [react-spa, vue-spa, nextjs, svelte-spa]
        combo:
          - { name: full, preset: full, test: true }
          - { name: minimal, preset: minimal, test: false }
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template "./${{ matrix.form }}" --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --preset "${{ matrix.combo.preset }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build rendered output
        working-directory: ${{ runner.temp }}/out
        run: |
          npm install
          npm run build
      - name: Test rendered output
        working-directory: ${{ runner.temp }}/out
        run: npm test

  # Its own job rather than a row in the matrix above, because what has to be
  # checked is not the exit code. Removing "main" from wrangler.jsonc makes the
  # build go green and produce no server bundle at all — a silent regression to
  # client-only rendering that takes every page out of search.
  react-router-ssr:
    name: react-router-ssr (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [full, minimal]
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./react-router-ssr --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify Site" --preset "${{ matrix.preset }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build, and prove the server bundle exists
        working-directory: ${{ runner.temp }}/out
        run: |
          npm install
          npm run cf-typegen
          npm run build
          test -f build/server/index.js || {
            echo "::error::the build produced no server bundle - the site would render client-side only"
            exit 1
          }
          npm run typecheck
          npm test

  pieces:
    name: ${{ matrix.case.form }} + ${{ matrix.case.piece }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - { form: react-spa, piece: axios-api }
          - { form: react-spa, piece: zustand-store }
          - { form: vue-spa, piece: pinia-store }
          - { form: nextjs, piece: zod-env }
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render and adopt the piece
        run: |
          templetry render --template "./${{ matrix.case.form }}" --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --preset minimal
          templetry add "${{ matrix.case.piece }}" "$RUNNER_TEMP/out" \
            --template "./${{ matrix.case.form }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build augmented output
        working-directory: ${{ runner.temp }}/out
        run: |
          npm install
          npm run build

  # The commands AGENTS.md hands to an agent have to be the ones this form is
  # verified with. Drift here is silent: the wrong command just runs.
  agents:
    name: AGENTS.md matches the manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/check-agents@main
