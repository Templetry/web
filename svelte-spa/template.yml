schema_version: 1
name: web-svelte-spa
description: Svelte 5 SPA — Vite + TypeScript, runes, optional Vitest
kinds: [frontend]
languages: [typescript]
frameworks: [svelte, vite]

variables:
  - key: project_name
    label: Project name
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9 ]*$"

identity:
  - from: "Template App"           # page title, headings
    to: "{project_name}"
  - from: "TemplateApp"            # docs
    to: "{project_name.pascal}"
  - from: "template-app"           # package.json name
    to: "{project_name.kebab}"

features:
  - key: environments
    label: development / staging / production profiles (ADR-0018)
    default: true
    files:
      - "src/config.ts"
      - "src/config.test.ts"
      - ".env.development"
      - ".env.staging"
      - ".env.production"
    patches:
      - file: package.json
        op: add
        path: /scripts/build:staging
        value: "svelte-check --tsconfig ./tsconfig.json && vite build --mode staging"

  - key: vitest
    label: Vitest unit tests
    default: true
    files: ["src/lib/greet.test.ts"]

presets:
  - key: full
    label: Everything on
    features: {environments: true, vitest: true}
  - key: minimal
    label: Bare SPA
    features: {environments: false, vitest: false}

verify:
  image: node:22
  run: npm install && npm run build
